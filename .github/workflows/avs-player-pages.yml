name: Publish AVS Player
on:
  push:
    branches: [main]
    paths: ['avs-player/**', '.github/workflows/avs-player-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: avs-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/avs-player
          cp avs-player/index.html avs-player/app.js avs-player/style.css _site/avs-player/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=avs-player/"><title>AVS Live Studio</title><a href="avs-player/">Open AVS Player</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

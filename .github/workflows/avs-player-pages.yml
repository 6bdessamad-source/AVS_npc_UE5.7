name: Publish AVS Player
on:
  push:
    branches: [main]
    paths: ['avs-player/**', 'index.html', '404.html', 'player.html', '.nojekyll', '.github/workflows/avs-player-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: avs-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site/avs-player
          cp -R avs-player/. _site/avs-player/
          cp index.html 404.html player.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
